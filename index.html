<title>Descarga TAiXI - Conviértete en conductor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --v: 100vh; }
  @supports (height: 100dvh) { :root { --v: 100dvh; } }
  html, body { height: 100%; }
  body { background: #050e1c; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #fff; height: 100vh; height: 100dvh; overflow: hidden; padding: 8px; }
  .wrap { max-width: 480px; height: 100%; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; justify-content: center; border: 3px solid #8B5CF6; border-radius: 28px; box-shadow: 0 0 28px rgba(139,92,246,.35); }
  .card { position: relative; width: min(100%, calc((var(--v) - 300px) * 0.5625)); aspect-ratio: 9 / 16; margin: 0 auto; flex: 0 0 auto; border-radius: 24px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
  .card img { display: block; width: 100%; height: 100%; }
  .btn { position: absolute; left: 11.11%; width: 77.78%; display: block; border-radius: 18px; }
  .btn:hover, .btn:focus { outline: 3px solid #35a9e1; outline-offset: 2px; }
  .btn-appstore { top: 46.87%; height: 12.97%; }
  .btn-googleplay { top: 61.72%; height: 16.88%; }
  .btn-whatsapp { left: 13.06%; top: 81.41%; width: 73.89%; height: 4.61%; border-radius: 12px; }
  .call { text-align: center; font-size: 15px; line-height: 1.35; color: #fff; margin-top: 8px; }
  .call a { color: #fff; font-weight: 700; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .store-btn { display: block; text-align: center; text-decoration: none; font-weight: 700; font-size: 17px; padding: 14px; border-radius: 14px; }
  .store-btn.apple { background: #fff; color: #0b1e38; }
  .store-btn.google { background: #35a9e1; color: #fff; }
  .store-btn.wa { background: #25d366; color: #fff; }
  .note { text-align: center; color: #8fa8c0; font-size: 13px; margin-top: 14px; }
</style>
